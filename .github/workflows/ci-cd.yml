name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 🔹 Этап 1: Сборка и тестирование
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven  # ✅ Кэширование Maven-зависимостей

      - name: Build with Maven
        run: ./mvnw clean compile

      - name: Run tests
        run: ./mvnw test

      - name: Generate JaCoCo report
        run: ./mvnw jacoco:report

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Package application
        run: ./mvnw package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-service-jar
          path: target/todo-service-*.jar

  # 🔹 Этап 2: Сборка и публикация Docker-образа
  build-and-push-docker:
    needs: build-and-test  # ✅ Запускается только если тесты прошли
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/todo-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/todo-service:buildcache,mode=max

  # 🔹 Этап 3: Деплой на виртуальную машину
  deploy:
    needs: build-and-push-docker  # ✅ Запускается только если Docker-образ собран
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Остановить старый контейнер
            docker stop todo-service || true
            docker rm todo-service || true
            
            # Pull новый образ
            docker pull ${{ secrets.DOCKER_USERNAME }}/todo-service:latest
            
            # Запустить новый контейнер
            docker run -d \
              --name todo-service \
              -p 8080:8080 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/todo-service:latest
            
            # Очистить старые образы
            docker image prune -f